name: Migrations

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORMHOLE_DATABASE_URL: postgres://wormhole:wormhole@localhost:5432/wormhole?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wormhole
          POSTGRES_PASSWORD: wormhole
          POSTGRES_DB: wormhole
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
      - name: Provision Activity database roles
        run: psql "$WORMHOLE_DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/scripts/provision-activity-roles.sql
      - name: Verify migration 21 and exact version-20 down shape
        run: |
          catalog_snapshot() {
            psql "$WORMHOLE_DATABASE_URL" -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'table:' || tablename FROM pg_catalog.pg_tables WHERE schemaname = 'public'
          UNION ALL SELECT 'function:' || p.proname || ':' || pg_catalog.pg_get_function_identity_arguments(p.oid)
            FROM pg_catalog.pg_proc p WHERE p.pronamespace = 'public'::regnamespace
          UNION ALL SELECT 'trigger:' || t.tgname || ':' || t.tgrelid::regclass::text
            FROM pg_catalog.pg_trigger t WHERE NOT t.tgisinternal AND t.tgrelid::regclass::text !~ '^pg_'
          UNION ALL SELECT 'policy:' || polname || ':' || polrelid::regclass::text FROM pg_catalog.pg_policy
          ORDER BY 1;
          SQL
          }
          migrate -path migrations -database "$WORMHOLE_DATABASE_URL" goto 20
          catalog_snapshot > /tmp/wormhole-v20-before.txt
          migrate -path migrations -database "$WORMHOLE_DATABASE_URL" goto 21
          WORMHOLE_INTEGRATION_REQUIRED=1 go test ./internal/core/git -run 'TestMigration21' -count=1
          migrate -path migrations -database "$WORMHOLE_DATABASE_URL" goto 20
          catalog_snapshot > /tmp/wormhole-v20-after.txt
          cmp /tmp/wormhole-v20-before.txt /tmp/wormhole-v20-after.txt
          WORMHOLE_INTEGRATION_REQUIRED=1 go test ./internal/core/git -run 'TestMigration21DownLeavesVersion20Shape' -count=1
      - name: Verify empty-database migrations
        run: |
          migrate -path migrations -database "$WORMHOLE_DATABASE_URL" up
          migrate -path migrations -database "$WORMHOLE_DATABASE_URL" down -all
      - name: Verify alpha upgrade
        run: .github/scripts/test-alpha-upgrade.sh
